# Render deployment blueprint for NorthStar's separate API and frontend.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are requested during initial Blueprint setup.

services:
  - type: web
    name: northstar
    runtime: node
    plan: free
    # The API serves frontend/dist as static files, so the frontend must be
    # BUILT here. Installing only the backend leaves no dist/ and the site
    # answers every request with the "NorthStar API is running" placeholder.
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production


      # PORT is deliberately NOT set here. Render injects its own PORT and
      # server.js binds to it, so hard-coding 5001 (or 5000) would break the
      # deploy the moment the platform hands out a different port.

      - key: NODE_VERSION
        value: "22"

      # generateValue renders a 64-character random string, which satisfies the
      # server's 32-character minimum. Never hard-code this value.
      - key: JWT_SECRET
        generateValue: true

      # MongoDB Atlas SRV string, e.g.
      # mongodb+srv://USER:PASS@cluster0.xxxxx.mongodb.net/northstar?retryWrites=true&w=majority
      # Paste the password URL-encoded (@ -> %40, and any # -> %23).
      - key: MONGODB_URI
        sync: false

      # Exact public URL of the static frontend service.

      - key: FRONTEND_URL
        sync: false

      - key: SESSION_MAX_AGE_DAYS
        value: "7"

      - key: PDF_MAX_FILES
        value: "5"

      - key: PDF_MAX_UPLOAD_MB
        value: "10"

      - key: PDF_MAX_PAGES
        value: "1000"

      - key: IMAGE_MAX_FILES
        value: "5"

      - key: IMAGE_MAX_UPLOAD_MB
        value: "5"

      - key: IMAGE_MAX_DIMENSION_PX
        value: "8000"

  - type: web
    name: northstar-frontend
    runtime: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_PDF_MAX_FILES
        value: "5"
      - key: VITE_PDF_MAX_UPLOAD_MB
        value: "10"
      - key: VITE_IMAGE_MAX_FILES
        value: "5"
      - key: VITE_IMAGE_MAX_UPLOAD_MB
        value: "5"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


