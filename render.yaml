# Render deployment blueprint for NorthStar — a SINGLE web service.
#
# The Express API also serves the built React frontend (frontend/dist) from the
# same origin, so no separate static site and no VITE_API_URL / cross-origin
# cookie handling are needed. Deploy: Render dashboard -> New -> Blueprint ->
# pick this repo. Values marked `sync: false` are requested during the initial
# Blueprint setup.

services:
  - type: web
    name: northstar
    runtime: node
    plan: free
    # Root directory is the repository root (leave "Root Directory" empty in
    # the Render dashboard) so both backend/ and frontend/ are in the checkout.
    #
    # The frontend MUST be built here: frontend/dist is git-ignored, so a
    # backend-only install leaves no dist/ and server.js answers every page
    # request with a 503 ("no frontend build found").
    #
    # --include=dev on the frontend install is REQUIRED: Render sets
    # NODE_ENV=production for the whole build, and npm then skips
    # devDependencies — where Vite lives. Without it, `vite build` fails with
    # "vite: not found" and the deploy never produces dist/.
    buildCommand: >-
      npm install --prefix backend
      && npm install --include=dev --prefix frontend
      && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is deliberately NOT set here. Render injects its own PORT and
      # server.js binds to it, so hard-coding 5001 (or 5000) would break the
      # deploy the moment the platform hands out a different port.

      - key: NODE_VERSION
        value: "22"

      # generateValue renders a 64-character random string, which satisfies the
      # server's 32-character minimum. Never hard-code this value.
      - key: JWT_SECRET
        generateValue: true

      # MongoDB Atlas SRV string, e.g.
      # mongodb+srv://USER:PASS@cluster0.xxxxx.mongodb.net/northstar?retryWrites=true&w=majority
      # Include the /northstar database name (the server appends it if the URI
      # omits it, but a matching dashboard value avoids silent "test" DB use).
      # Paste the password URL-encoded (@ -> %40, and any # -> %23).
      - key: MONGODB_URI
        sync: false

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_APP_PASSWORD
        sync: false

      - key: OTP_EXPIRES_MINUTES
        value: "10"

      # Exact public URL of THIS service (https://northstar.onrender.com).
      # The API serves the frontend, so this is both the site and the API
      # origin. Required by env validation; same-origin requests are also
      # allowed automatically as a safety net.
      - key: FRONTEND_URL
        sync: false

      # Optional extra CORS origins, comma-separated. Same-origin never needs
      # to be listed.

      - key: SESSION_MAX_AGE_DAYS
        value: "7"

      - key: PDF_MAX_FILES
        value: "5"

      - key: PDF_MAX_UPLOAD_MB
        value: "10"

      - key: PDF_MAX_PAGES
        value: "1000"

      - key: IMAGE_MAX_FILES
        value: "5"

      - key: IMAGE_MAX_UPLOAD_MB
        value: "5"

      - key: IMAGE_MAX_DIMENSION_PX
        value: "8000"
